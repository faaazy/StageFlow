services:
  postgres:
    image: postgres:18

    environment:
      POSTGRES_DB: stageflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stageflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
